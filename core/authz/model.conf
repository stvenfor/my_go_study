# Casbin RBAC 模型配置：用户/角色 → 资源 → 操作的访问控制
# 与项目现有自建 RBAC（role/permission/role_permission/user_role）并行提供，
# 新业务可优先使用 Casbin；老业务保持原有 SQL 实现不变。

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && r.obj == p.obj && r.act == p.act
