services:
  postgres:
    image: postgres:16-alpine
    container_name: my_go_study_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: my_go_study
    # 仅绑定本机，避免家庭局域网扫到 Postgres（LAN 方案见 docker-compose.lan.yml）
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d my_go_study"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: my_go_study_redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: my_go_study_rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: my_go_study_elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  # 一次性迁移服务（parity-p0-1）：app/worker 启动前把 schema 推平后退出。
  # 复用 app 镜像（镜像里带 /app/migrate + /app/migrations + psql）。
  # 判库逻辑见 scripts/migrate-entrypoint.sh；想禁用旧库自动基线：MIGRATE_BASELINE=off。
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: my_go_study-app:latest
    container_name: my_go_study_migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_DBNAME: my_go_study
      DATABASE_SSLMODE: disable
      MIGRATE_BASELINE: ${MIGRATE_BASELINE:-auto}
    command: ["/app/scripts/migrate-entrypoint.sh"]
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: my_go_study-app:latest
    container_name: my_go_study_app
    # 冷启动时 RabbitMQ 的 AMQP 监听可能比 healthcheck 慢一拍，app 连不上会直接退出；
    # 加重启策略让其自愈，避免 make lan-up 首启偶发 Exited(1)。
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    # 宿主机 env 由 scripts/docker-compose.sh / lan-compose.sh source 后注入下方 ${VAR}
    environment:
      APP_ENV: ${APP_ENV:-dev}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-}
      SERVER_PORT: 8080
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_DBNAME: my_go_study
      # compose 里 DDL 只由一次性 migrate 服务负责（parity-p0-1）：显式置 false，
      # 免得 APP_ENV=dev 时 configs/config.dev.yaml 的逃生门把建表又带回启动路径，
      # 和 worker 并发撞 DDL。要临时恢复建表：DATABASE_AUTO_MIGRATE=true make docker-up。
      DATABASE_AUTO_MIGRATE: ${DATABASE_AUTO_MIGRATE:-false}
      DATABASE_SCHEMA_VERSION_CHECK: ${DATABASE_SCHEMA_VERSION_CHECK:-true}
      DATABASE_MIGRATIONS_DIR: /app/migrations
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必填：本地见 .env.example，部署须注入随机串（不再有兜底默认值）}
      QUEUE_ENABLED: ${QUEUE_ENABLED:-true}
      GRPC_ENABLED: ${GRPC_ENABLED:-true}
      GRPC_PORT: ${GRPC_PORT:-9090}
      # h7：/metrics 默认只本机(loopback)可达；这里只放行 Docker 内网容器网段，
      # 使 prometheus.yml 的 app:8080/metrics 抓取仍可用。docker-proxy 网关
      # （192.168.65.1 等，含局域网与宿主机端口映射访问）不在该网段 => 被拒。
      METRICS_ALLOW_CIDRS: ${METRICS_ALLOW_CIDRS:-172.16.0.0/12,10.0.0.0/8}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      AUTH_SESSION_WHITELIST_EMAILS: ${AUTH_SESSION_WHITELIST_EMAILS:-}
      AUTH_SESSION_WHITELIST_USER_IDS: ${AUTH_SESSION_WHITELIST_USER_IDS:-}
      AUTH_DEV_TEST_PHONE: ${AUTH_DEV_TEST_PHONE:-}
      AUTH_DEV_TEST_OTP: ${AUTH_DEV_TEST_OTP:-}
      AUTH_DEV_TEST_PASSWORD: ${AUTH_DEV_TEST_PASSWORD:-}
      RONGCLOUD_APP_KEY: ${RONGCLOUD_APP_KEY:-}
      RONGCLOUD_APP_SECRET: ${RONGCLOUD_APP_SECRET:-}
      RONGCLOUD_API_BASE_URL: ${RONGCLOUD_API_BASE_URL:-https://api.rong-api.com}
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ../logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    container_name: my_go_study_worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV:-dev}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_DBNAME: my_go_study
      DATABASE_AUTO_MIGRATE: ${DATABASE_AUTO_MIGRATE:-false}
      DATABASE_SCHEMA_VERSION_CHECK: ${DATABASE_SCHEMA_VERSION_CHECK:-true}
      DATABASE_MIGRATIONS_DIR: /app/migrations
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必填：本地见 .env.example，部署须注入随机串（不再有兜底默认值）}
      QUEUE_ENABLED: ${QUEUE_ENABLED:-true}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    command: ["/app/worker"]
    volumes:
      - ../logs:/app/logs
    # 镜像默认 HEALTHCHECK 打 /health；worker 无 HTTP，必须关闭
    healthcheck:
      disable: true

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: my_go_study_prometheus
    depends_on:
      - app
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
      - --web.enable-lifecycle
    volumes:
      - ../deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: my_go_study_alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../deploy/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"

  feishu-adapter:
    image: python:3.12-alpine
    container_name: my_go_study_feishu_adapter
    environment:
      FEISHU_ALERT_WEBHOOK_URL: ${FEISHU_ALERT_WEBHOOK_URL:-}
      FEISHU_ADAPTER_PORT: "8089"
    volumes:
      - ../deploy/observability/feishu_adapter.py:/app/feishu_adapter.py:ro
    working_dir: /app
    command: ["python", "/app/feishu_adapter.py"]
    # 无对外端口：仅 Docker 网络内供 Alertmanager 调用

  grafana:
    image: grafana/grafana:11.2.0
    container_name: my_go_study_grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: "3000"
    volumes:
      - ../deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
  elasticsearch_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
