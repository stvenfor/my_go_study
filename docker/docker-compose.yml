services:
  postgres:
    image: postgres:16-alpine
    container_name: my_go_study_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: my_go_study
    # 仅绑定本机，避免家庭局域网扫到 Postgres（LAN 方案见 docker-compose.lan.yml）
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d my_go_study"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: my_go_study_redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: my_go_study_app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 宿主机 env 由 scripts/docker-compose.sh / lan-compose.sh source 后注入下方 ${VAR}
    environment:
      APP_ENV: ${APP_ENV:-dev}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-}
      SERVER_PORT: 8080
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_DBNAME: my_go_study
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      QUEUE_ENABLED: ${QUEUE_ENABLED:-true}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      AUTH_SESSION_WHITELIST_EMAILS: ${AUTH_SESSION_WHITELIST_EMAILS:-}
      AUTH_SESSION_WHITELIST_USER_IDS: ${AUTH_SESSION_WHITELIST_USER_IDS:-}
      AUTH_DEV_TEST_PHONE: ${AUTH_DEV_TEST_PHONE:-}
      AUTH_DEV_TEST_OTP: ${AUTH_DEV_TEST_OTP:-}
      AUTH_DEV_TEST_PASSWORD: ${AUTH_DEV_TEST_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - ../logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: my_go_study_worker
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV:-dev}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_DBNAME: my_go_study
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      QUEUE_ENABLED: ${QUEUE_ENABLED:-true}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    command: ["/app/worker"]
    volumes:
      - ../logs:/app/logs
    # 镜像默认 HEALTHCHECK 打 /health；worker 无 HTTP，必须关闭
    healthcheck:
      disable: true

volumes:
  postgres_data:
