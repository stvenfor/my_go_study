# config.dev.yaml 开发环境覆盖项（本机 make run 默认连 localhost）。
# Docker 部署时由 docker-compose.yml 注入 DATABASE_HOST=postgres 等环境变量覆盖。

server:
  mode: debug

log:
  level: debug

database:
  host: localhost
  # 本机逃生门（parity-p0-1）：空库也能 make run 起来。
  # 注意此时版本校验会走「库无 schema_migrations」分支，只提示不拦启动。
  auto_migrate: true

redis:
  addr: localhost:6379

# 测试环境固定手机号 OTP（仅非 prod APP_ENV（如 dev/lan）生效；逗号分隔多号）
auth:
  dev_test_phone: "13400000000,13400000001,13400000002,13400000003,13400000004"
  dev_test_otp: "123456"
  dev_test_password: "dev-test-phone-secret"
  # 单设备白名单（可选）：内部测试账号可多设备登录
  # session_whitelist_emails:
  #   - "demo@example.com"

# Supabase 常量见 configs/supabase.env（入库）；service_role 见 .env.local

# 开发环境启用 RabbitMQ 队列；Push 同步直投本地 WS，避免 Pub/Sub 延迟/丢投
queue:
  enabled: true
  push_async: false

# 本机 make run 时若已 docker 起 ES：ELASTICSEARCH_URL=http://127.0.0.1:9200
# elasticsearch:
#   url: http://127.0.0.1:9200

# 开发环境关闭整点广播 Cron（hourly_notify）；需手动：make trigger-hourly-notify
# scheduler.enabled 仍为 true，便于 worker 其它调度能力；真正开关在 hourly_notify.enabled
scheduler:
  enabled: true
  hourly_notify:
    enabled: false
  # 本地没有商户凭据时，查单只会逐条 Warn（不会误置 failed），保持开启以便联调核销链路。
  # 对账需要真实凭据 + 渠道账单，dev 关闭以免天天写假差异。
  payment:
    enabled: true
    reconcile_enabled: false

# 演示/联调：短视频发布后读取即放行，Flutter 侧不会看到空白发现流
# （仅因 APP_ENV=dev 非正式才生效；正式环境永远是 reject_until_manual）
short_video:
  review_mode: auto_allow_local_only
