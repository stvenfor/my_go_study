# config.lan.yaml — 本机局域网后端（本地 Auth + Postgres + 局域网暴露）。
# 真实 IP / 白名单见 .env.lan；详见 docs/lan-backend-host.md · docs/local-auth-postgres.md

server:
  mode: debug

log:
  level: info

auth:
  provider: local
  # 可选：.env.lan 设置 AUTH_DEV_TEST_* 启用测试手机号 OTP
  dev_test_phone: ""
  dev_test_otp: ""
  dev_test_password: ""

queue:
  enabled: true
  push_async: false

scheduler:
  enabled: true
  hourly_notify:
    enabled: false
