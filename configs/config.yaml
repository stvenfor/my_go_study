# config.go 使用 Viper 加载 YAML 配置，并支持环境变量覆盖。

server:
  port: 8080
  mode: debug

grpc:
  enabled: true
  port: 9090

# 小视频审核：默认拒绝直到人工放行（reject_until_manual）
# 联调演示请在 config.dev/lan.yaml 覆盖成 auto_allow_local_only
short_video:
  review_mode: reject_until_manual

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  dbname: my_go_study
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime_minutes: 30
  # 启动期 DDL 总开关（parity-p0-1）：默认关 —— schema 由 migrations/ + make migrate-up 管，
  # 多实例并发启动不再抢 DDL 锁。本机联调想免迁移在 configs/config.dev.yaml 置 true；
  # APP_ENV=lan|prod 由 common/config 强制 false（改 yaml 也开不开）。
  auto_migrate: false
  # 启动时比对库内 schema_migrations 版本与 migrations/ 最高版本，落后（或 dirty）即拒绝启动。
  schema_version_check: true
  # 相对进程工作目录；仓库根启动（make run / compose 的 /app）都能解析。
  migrations_dir: migrations

redis:
  addr: localhost:6379
  password: ""
  db: 0

jwt:
  # 必须来自 JWT_SECRET（env / .env）；留空则 config.Load 直接拒绝启动，
  # 不再有可用的硬编码兜底密钥。prod 另要求长度 ≥ 32 且不在弱值字典内。
  secret: ""
  expire_hours: 72

auth:
  session_ttl_hours: 0
  session_whitelist_user_ids: []
  session_whitelist_emails: []

supabase:
  url: ""
  anon_key: ""
  service_role_key: ""

log:
  level: info
  file: logs/app.log
  max_size: 100
  max_backups: 7
  max_age: 30
  compress: true

realtime:
  ws_path: /realtime/v1/connect
  ticket_ttl_seconds: 120
  heartbeat_interval_seconds: 25
  max_connections_per_user: 3
  event_retention: 200
  public_ws_host: "127.0.0.1"

# 异步任务队列（RabbitMQ + Redis Pub/Sub 多实例 WS 广播）
queue:
  enabled: false
  rabbitmq:
    url: amqp://guest:guest@localhost:5672/
    queue: my_go_study.tasks
    prefetch: 10
    # 死信：消费失败超过 max_retries 次后 Nack(requeue=false) 进 dlq
    # 队列参数不可变，改这里不会作用于已存在的队列，
    # 见 scripts/rabbitmq-ensure-dlq.sh
    dlx: my_go_study.tasks.dlx
    dlq: my_go_study.tasks.dlq
    max_retries: 3
    # 单条消息处理超时，防止一条卡死 prefetch 窗口
    handler_timeout_seconds: 30
    # 发布侧等 broker 落盘确认（串行化发布，吞吐略降；关=false 只依赖本地错误）
    publisher_confirm: true
  pubsub:
    channel: realtime:fanout

# 交易全文（空 url 关闭；lan-up 默认 http://elasticsearch:9200）
elasticsearch:
  url: ""

# 定时任务（每小时系统通知，需 make run-worker）
scheduler:
  enabled: false
  timezone: Asia/Shanghai
  hourly_notify:
    enabled: false
    cron: "0 10-19 * * *"
    title_template: "整点提醒"
    body_template: "现在是 {{hour}}:00，{{message}}"
    default_message: "别错过重要消息"
    expires_minutes: 120
    action:
      type: deeplink
      route: /home
  # 渠道支付兜底任务（P0-2，由 cmd/worker 入队、同一进程核销）：
  # 查单是「回调丢了」的兜底；对账是 T+1 比对本日流水与渠道事实。
  payment:
    enabled: false
    query_interval_minutes: 5   # 每轮扫一次超时 pending
    pending_stale_minutes: 10   # 超过该时长仍未核销 → 认为回调可能丢失
    query_batch: 200            # 单轮上限，避免把渠道打爆
    reconcile_enabled: false    # 需真实商户凭据才有意义，默认关
    reconcile_hour: 3           # 每天本地时区 03:00 对昨天

# AI 小石头 SSE 生成流（与 Realtime WS 分离，见 docs/sse-streaming.md）
sse:
  enabled: true
  provider: mock          # mock | openai_compatible
  max_prompt_bytes: 8192
  max_tokens: 2048
  keepalive_seconds: 15
  request_timeout_seconds: 120
  rate_limit_per_user_per_minute: 20
  conversation_ttl_seconds: 1800   # 停留会话滑动 TTL（30 分钟）
  max_turns: 10
  openai:
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o-mini"
    # api_key 仅环境变量 SSE_OPENAI_API_KEY；勿写入仓库

# 客服 Agent（Eino Tool + SSE；与小石头路由分离）
cs_agent:
  enabled: true
  provider: mock
  chunk_delay_ms: 20
  keepalive_seconds: 15
  request_timeout_seconds: 120
  model: cs-mock

# 客服 RAG 管线：本地 KB 文档 → 向量化 → Elasticsearch 检索 → 注入 LLM。
# embedding_* 留空则回落到 sse.openai（即 SSE_OPENAI_* 环境变量），零新增 env。
rag:
  enabled: false            # 需同时配置 elasticsearch.url 与 SSE_OPENAI_API_KEY 才真正生效
  embedding_base_url: ""
  embedding_api_key: ""
  embedding_model: "text-embedding-3-small"
  index_name: "rag_chunks"
  kb_dir: "data/cs-kb"
  chunk_size: 800
  chunk_overlap: 100
  top_k: 4
  reindex_interval_seconds: 0
